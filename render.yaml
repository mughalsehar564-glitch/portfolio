services:
  - type: web
    name: portfolio-server
    runtime: node
    plan: free
    buildCommand: "npm run install:server && npm run build:client"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SERVE_FRONTEND
        value: "true"
